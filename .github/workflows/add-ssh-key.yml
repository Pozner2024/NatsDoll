name: Add SSH key (temporary, remove after use)

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'Public key line to append to authorized_keys'
        required: true

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Append public key to authorized_keys
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          envs: PUBKEY
          script: |
            set -e
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            grep -qxF "$PUBKEY" ~/.ssh/authorized_keys || echo "$PUBKEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "authorized_keys now has $(wc -l < ~/.ssh/authorized_keys) line(s)"
        env:
          PUBKEY: ${{ inputs.pubkey }}
